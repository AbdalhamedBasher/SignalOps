# Render Blueprint for SignalOps AI
# Provisions managed PostgreSQL, FastAPI backend with migrations, and React frontend

services:
  # 1. FastAPI Backend API Service
  - type: web
    name: signalops-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: signalops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        sync: false
      - key: NOKIA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. React + TypeScript Dashboard Static Site
  - type: web
    name: signalops-dashboard
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: signalops-api
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: signalops-db
    databaseName: signalops
    user: signalops
    plan: free
