[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalops-api"
version = "0.1.0"
description = "FastAPI backend for the SignalOps AI telecom incident MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt>=2.9,<3.0",
  # Argon2id rather than bcrypt: it is the current OWASP recommendation and has
  # no silent 72-byte truncation to trip over.
  "argon2-cffi>=23.1,<26.0",
  "psycopg[binary]>=3.1,<4.0",
  # The slim distribution with only the Google provider. The `pydantic-ai`
  # meta-package would also drag in the Anthropic and OpenAI SDKs, which this
  # project deliberately does not use — the agent runs on Gemini.
  "pydantic-ai-slim[google]>=2.0,<3.0",
  # Nokia's own Network as Code client, for the CAMARA calls.
  "network-as-code>=10.0,<11.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<9",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Alembic writes these from its own template; they are a historical record and
# are not ours to restyle.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# env.py has to extend sys.path before it can import the app package, so its
# imports cannot be sorted or hoisted to the top.
"alembic/env.py" = ["E402", "I001"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is how FastAPI declares dependencies.
# B008 exists to catch accidental shared mutable defaults, which this is not.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  # Builds a dependency callable; it is evaluated once at import, which is the
  # intent, not an accidental shared mutable default.
  "app.auth.require_role",
]
